<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MOVA — Rentabilité Immobilière</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--noir:#0a0a0a;--blanc:#f5f3ee;--or:#c9a84c;--gris:#1e1e1e;--gris2:#2c2c2c;--gris3:#3a3a3a;--dim:#888;--mid:#bbb;--vert:#4caf7d;--rouge:#e05a5a;--bleu:#5a9ce0;--r:6px}
body{background:var(--noir);color:var(--blanc);font-family:'Sora',sans-serif;min-height:100vh}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid #1a1a1a}
.logo{font-family:'DM Serif Display',serif;font-size:26px;color:var(--or);letter-spacing:2px}
.logo span{color:var(--blanc);font-size:13px;font-weight:300;margin-left:10px;opacity:.5}
.bp{background:var(--or);color:var(--noir);border:none;border-radius:var(--r);padding:9px 20px;font-family:'Sora',sans-serif;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:1px;text-transform:uppercase}
.bp:hover{opacity:.85}
.bs{background:none;border:1px solid var(--gris3);color:var(--mid);border-radius:var(--r);padding:9px 18px;font-family:'Sora',sans-serif;font-size:12px;cursor:pointer;letter-spacing:1px;text-transform:uppercase}
.bs:hover{border-color:var(--mid);color:var(--blanc)}
.dash{padding:32px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:32px}
.kpi{background:var(--gris);border:1px solid var(--gris3);border-radius:var(--r);padding:20px}
.kl{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:6px}
.kv{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--or)}
.ks{font-size:11px;color:var(--dim);margin-top:4px}
.kdiv{border-top:1px solid var(--gris3);margin:8px 0;padding-top:8px}
.kls{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:2px}
.kvs{font-family:'DM Mono',monospace;font-size:17px;font-weight:500}
.tw{background:var(--gris);border:1px solid var(--gris3);border-radius:var(--r);overflow:hidden}
.th2{padding:16px 20px;border-bottom:1px solid var(--gris3);font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--dim)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:10px 11px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);border-bottom:1px solid var(--gris3);font-weight:500;white-space:nowrap}
td{padding:11px;font-size:12px;border-bottom:1px solid #1a1a1a}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--gris2)}
.badge{display:inline-block;padding:3px 8px;border-radius:3px;font-size:9px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.bo{background:rgba(90,156,224,.15);color:var(--bleu)}
.ba{background:rgba(76,175,125,.15);color:var(--vert)}
.br{background:rgba(224,90,90,.15);color:var(--rouge)}
.bs2{background:rgba(201,168,76,.15);color:var(--or)}
.mono{font-family:'DM Mono',monospace}
.cor{color:var(--or)}.cv{color:var(--vert)}.cr{color:var(--rouge)}.cb{color:var(--bleu)}.cd{color:var(--dim);font-size:11px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:100;overflow-y:auto}
.mod{background:var(--gris);border:1px solid var(--gris3);border-radius:8px;width:100%;max-width:820px;margin:auto}
.mh{padding:20px 24px;border-bottom:1px solid var(--gris3);display:flex;align-items:center;justify-content:space-between}
.mt{font-family:'DM Serif Display',serif;font-size:20px;color:var(--or)}
.ms{font-size:11px;color:var(--dim);margin-top:3px}
.xb{background:none;border:1px solid var(--gris3);color:var(--dim);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
.xb:hover{border-color:var(--or);color:var(--or)}
.mb{padding:24px;display:flex;flex-direction:column;gap:20px}
.st{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--or);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--gris3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
.fld input,.fld select,.fld textarea{background:var(--noir);border:1px solid var(--gris3);color:var(--blanc);padding:9px 12px;border-radius:var(--r);font-family:'DM Mono',monospace;font-size:13px;outline:none;width:100%}
.fld input:focus,.fld textarea:focus{border-color:var(--or)}
.fld textarea{font-family:'Sora',sans-serif;font-size:12px;resize:vertical;min-height:70px}
.ss{display:flex;gap:8px;flex-wrap:wrap}
.so{padding:6px 14px;border-radius:3px;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:600;cursor:pointer;border:1px solid var(--gris3);color:var(--dim);background:var(--noir)}
.so-offre{background:rgba(90,156,224,.2);color:var(--bleu);border-color:var(--bleu)}
.so-acceptee{background:rgba(76,175,125,.2);color:var(--vert);border-color:var(--vert)}
.so-refusee{background:rgba(224,90,90,.2);color:var(--rouge);border-color:var(--rouge)}
.so-suivi{background:rgba(201,168,76,.2);color:var(--or);border-color:var(--or)}
.cr2{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--noir);border-radius:var(--r);font-size:12px;margin-bottom:4px}
.ctot{border:1px solid var(--or)}
.ctot span:first-child{color:var(--or);font-weight:600}
.ctot span:last-child{color:var(--or)}
.rt{width:100%;border-collapse:collapse}
.rt th{padding:9px 12px;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;font-weight:500;border-bottom:1px solid var(--gris3)}
.rt td{padding:8px 12px;font-size:13px;border-bottom:1px solid #1e1e1e;font-family:'DM Mono',monospace}
.rtw{background:var(--noir);border:1px solid var(--gris3);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.cbr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mid);cursor:pointer}
.cbr input{accent-color:var(--or);width:auto}
.mf{padding:16px 24px;border-top:1px solid var(--gris3);display:flex;gap:10px;justify-content:flex-end;align-items:center}
.dv{background:var(--noir);border:1px solid var(--gris3);border-radius:var(--r);padding:9px 12px;font-size:12px;font-family:'DM Mono',monospace;color:var(--or);min-height:38px}
@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}.dash{padding:16px}.hdr{padding:14px 16px}}
</style>
</head>

</div>
<div class="dash">

  </div>

<script>

// ── Supabase Config ──────────────────────────────────────────────────────
var SB_URL = 'https://hmvnfllcyrtnloqdghby.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhtdm5mbGxjeXJ0bmxvcWRnaGJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMzQ2MjEsImV4cCI6MjA5NTcxMDYyMX0.8F6MkmipzwFUH69Di--AbCC8vUFew6K8GMrCoTeYo0Q';

function sbHeaders() {
  return {
    'Content-Type': 'application/json',
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY
  };
}

// Charger les actifs depuis Supabase
function loadFromSupabase(callback) {
  fetch(SB_URL + '/rest/v1/actifs?order=created_at.asc', {
    headers: sbHeaders()
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (Array.isArray(data) && data.length > 0) {
      actifs = data.map(function(row) {
        var a = JSON.parse(row.data);
        a.id = row.id;
        return a;
      });
      callback();
    } else {
      // Première utilisation — insérer ACT-001 par défaut
      var def = JSON.parse(JSON.stringify(DEF));
      insertActif(def, function() {
        actifs = [def];
        callback();
      });
    }
  })
  .catch(function() {
    // Fallback localStorage si pas de connexion
    try { var s = localStorage.getItem('mova'); if(s) actifs = JSON.parse(s); } catch(e) {}
    if (!actifs.length) actifs = [JSON.parse(JSON.stringify(DEF))];
    callback();
  });
}

// Insérer un nouvel actif
function insertActif(a, callback) {
  fetch(SB_URL + '/rest/v1/actifs', {
    method: 'POST',
    headers: Object.assign({}, sbHeaders(), {'Prefer': 'return=representation'}),
    body: JSON.stringify({ ref: a.ref, data: JSON.stringify(a) })
  })
  .then(function(r) { return r.json(); })
  .then(function(rows) {
    if (rows && rows[0]) { a.id = rows[0].id; }
    if (callback) callback();
  })
  .catch(function() { if (callback) callback(); });
}

// Mettre à jour un actif existant
function updateActif(a, callback) {
  if (!a.id || typeof a.id !== 'number') { if(callback) callback(); return; }
  fetch(SB_URL + '/rest/v1/actifs?id=eq.' + a.id, {
    method: 'PATCH',
    headers: Object.assign({}, sbHeaders(), {'Prefer': 'return=minimal'}),
    body: JSON.stringify({ ref: a.ref, data: JSON.stringify(a) })
  })
  .then(function() { if (callback) callback(); })
  .catch(function() { if (callback) callback(); });
}

// Afficher indicateur de sync
function showSync(ok) {
  var el = document.getElementById('sync-indicator');
  if (!el) return;
  el.textContent = ok ? '✓ Synchronisé' : '⚠ Hors ligne';
  el.style.color = ok ? '#4caf7d' : '#e05a5a';
}

var E = function(id){return document.getElementById(id);};
var fmt = function(n){return (isNaN(n)||n===null||n===undefined)?'—':Number(n).toLocaleString('fr-FR',{maximumFractionDigits:0})+' €';};
var fmtP = function(n){return (isNaN(n)||n===null)?'—':Number(n).toFixed(1)+' %';};
var esc = function(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};

function vide(){return {id:Date.now(),ref:'',adresse:'',ville:'',nature:'',typeImmeuble:'',surface:'',surfaceApres:'',statut:'offre',prixOffre:'',tauxAgenceAchat:'0',tauxNotaire:'3',travaux:'',tauxBancaire:'7',tauxHypotheque:'1.5',fraisLeveeHypotheque:'1500',tauxSEP:'2',taxeFonciere:'',charges:'',geometre:false,coutGeometre:'996',ingenieurBeton:false,coutIngenieur:'',age:false,coutAGE:'',rachatPartieCommune:false,coutRachat:'1000',modificationRCP:false,coutRCP:'',permisConstructire:false,coutPermis:'',prixReventeConservateur:'',prixReventeCible:'',prixRevente:'',tauxAgenceRevente:'5',agenceNom:'',agenceTauxCommission:'',lienAnnonce:'',notes:''};}

var DEF = vide();
DEF.id=1;DEF.ref='ACT-001';DEF.adresse='131 rue Greuze';DEF.ville='Paris 16e';
DEF.nature='Immeuble — Division 2 lots';DEF.typeImmeuble='Haussmannien';
DEF.surface='158';DEF.surfaceApres='158';DEF.statut='offre';
DEF.prixOffre='1264000';DEF.tauxAgenceAchat='0';DEF.tauxNotaire='3';DEF.travaux='268600';
DEF.tauxBancaire='7';DEF.tauxHypotheque='1.5';DEF.fraisLeveeHypotheque='1500';DEF.tauxSEP='2';
DEF.taxeFonciere='';DEF.charges='';
DEF.geometre=false;DEF.ingenieurBeton=false;
DEF.age=true;DEF.coutAGE='800';
DEF.rachatPartieCommune=false;DEF.modificationRCP=true;DEF.coutRCP='2000';DEF.permisConstructire=false;
DEF.prixReventeConservateur='2291000';DEF.prixReventeCible='2449000';DEF.prixRevente='2291000';
DEF.tauxAgenceRevente='5';DEF.agenceNom='';DEF.agenceTauxCommission='';DEF.lienAnnonce='';
DEF.notes="F5 115m² (RDC) + F3 43m² (étage). Prix FAI. Travaux 1700€/m². Cour arborée, au calme. Conservateur 14500€/m² | Cible 15500€/m². AGE + modif RCP liées à la division.";
var ACT002 = vide();
ACT002.id = 2;
ACT002.ref = 'ACT-002';
ACT002.adresse = '141 rue de Vaugirard';
ACT002.ville = 'Paris 15e';
ACT002.nature = 'Appartement';
ACT002.statut = 'offre';
ACT002.prixOffre = '240000';
ACT002.tauxAgenceAchat = '0';
ACT002.tauxNotaire = '3';
ACT002.agenceNom = 'Century 21';
ACT002.agenceTauxCommission = '';
ACT002.notes = 'Visite faite avec Jacques Herlaud (Century 21). Prix vendeur : 315 000€. Offre à 240 000€.';


function calc(a,revOverride){
  var pr=parseFloat(a.prixOffre)||0;
  var rv=parseFloat(revOverride||a.prixRevente)||0;
  var su=parseFloat(a.surface)||1;
  var tr=parseFloat(a.travaux)||0;
  var fAA=pr*(parseFloat(a.tauxAgenceAchat)/100||0);
  var fN=pr*(parseFloat(a.tauxNotaire)/100||0.03);
  var fB=pr*(parseFloat(a.tauxBancaire)/100||0.07)*0.75*(10/12);
  var fH=pr*(parseFloat(a.tauxHypotheque)/100||0.015);
  var fLH=parseFloat(a.fraisLeveeHypotheque)||1500;
  var fSEP=(pr+tr)*(parseFloat(a.tauxSEP)/100||0.02);
  var fC=(parseFloat(a.taxeFonciere)||0)+(parseFloat(a.charges)||0);
  var fS=(a.geometre?parseFloat(a.coutGeometre)||996:0)+(a.ingenieurBeton?parseFloat(a.coutIngenieur)||0:0)+(a.age?parseFloat(a.coutAGE)||0:0)+(a.rachatPartieCommune?parseFloat(a.coutRachat)||1000:0)+(a.modificationRCP?parseFloat(a.coutRCP)||0:0)+(a.permisConstructire?parseFloat(a.coutPermis)||0:0);
  var fAR=rv*(parseFloat(a.tauxAgenceRevente)/100||0.05);
  var tot=pr+fAA+fN+tr+fB+fH+fLH+fSEP+fC+fS;
  var pv=rv-fAR-tot;
  var mg=tot>0?(pv/tot)*100:0;
  return {fAA:fAA,fN:fN,fB:fB,fH:fH,fLH:fLH,fSEP:fSEP,fC:fC,fS:fS,fAR:fAR,tot:tot,pv:pv,mg:mg,m2:pr/su};
}

var actifs=[];var cur=null;var isNew=false;

function load(){
  showSync && document.getElementById('sync-indicator') && (document.getElementById('sync-indicator').textContent = '⟳ Chargement…');
  loadFromSupabase(function() {
    render();
    showSync(true);
  });
}
function save2LS(){
  // Backup localStorage
  try{localStorage.setItem('mova',JSON.stringify(actifs));}catch(e){}
}

function slabel(s){return{offre:'Offre',acceptee:'Acceptée',refusee:'Refusée',suivi:'Suivi'}[s]||s;}
function sclass(s){return{offre:'bo',acceptee:'ba',refusee:'br',suivi:'bs2'}[s]||'';}

function render(){renderKPI();renderTable();}

function renderKPI(){
  var n=actifs.length;
  var tot=actifs.reduce(function(s,a){return s+(parseFloat(a.prixOffre)||0);},0);
  var vo=0,no=0,va=0,na=0,vs=0,ns=0;
  actifs.forEach(function(a){var p=parseFloat(a.prixOffre)||0;if(a.statut==='offre'){vo+=p;no++;}if(a.statut==='acceptee'){va+=p;na++;}if(a.statut==='suivi'){vs+=p;ns++;}});
  var pvc=0,pvt=0,msc=0,mst=0,nc=0,nt=0;
  actifs.forEach(function(a){
    if(a.prixReventeConservateur){var c=calc(a,a.prixReventeConservateur);pvc+=c.pv;msc+=c.mg;nc++;}
    if(a.prixReventeCible){var c=calc(a,a.prixReventeCible);pvt+=c.pv;mst+=c.mg;nt++;}
  });
  var mc=nc>0?msc/nc:null;var mt=nt>0?mst/nt:null;
  var margePers = 0.20;
  E('kpis').innerHTML=
    kpi('Actifs suivis',n,fmt(tot)+' au total','var(--or)')+
    kpi2('En offre',fmt(vo),(no)+' bien'+(no>1?'s':'')+' en attente','var(--bleu)')+
    kpi2('Acceptés',fmt(va),(na)+' bien'+(na>1?'s':'')+' validé'+(na>1?'s':''),'var(--vert)')+
    kpi2('En transformation',fmt(vs),(ns)+' bien'+(ns>1?'s':'')+' en cours','var(--or)')+
    '<div class="kpi"><div class="kl">Plus-value estimée</div>'+
    '<div style="margin-top:4px">'+
    '<div class="kls cb">Conservatrice</div>'+
    '<div class="kvs '+(pvc>=0?'cv':'cr')+'">'+fmt(pvc)+'</div>'+
    '<div class="ks">marge moy. '+(mc!==null?fmtP(mc):'—')+'</div>'+
    '<div class="kdiv">'+
    '<div class="kls cor">Cible</div>'+
    '<div class="kvs '+(pvt>=0?'cv':'cr')+'">'+fmt(pvt)+'</div>'+
    '<div class="ks">marge moy. '+(mt!==null?fmtP(mt):'—')+'</div>'+
    '</div></div></div>'+
    '<div class="kpi"><div class="kl">Ma marge (20%)</div>'+
    '<div style="margin-top:4px">'+
    '<div class="kls cb">Conservatrice</div>'+
    '<div class="kvs '+(pvc>=0?'cv':'cr')+'">'+fmt(pvc*margePers)+'</div>'+
    '<div class="ks">sur '+fmtP(margePers*100)+' de la PV</div>'+
    '<div class="kdiv">'+
    '<div class="kls cor">Cible</div>'+
    '<div class="kvs '+(pvt>=0?'cv':'cr')+'">'+fmt(pvt*margePers)+'</div>'+
    '<div class="ks">sur '+fmtP(margePers*100)+' de la PV</div>'+
    '</div></div></div>';
  E('th2').textContent='Actifs — '+n+' bien'+(n>1?'s':'');
}
function kpi(l,v,s,c){return '<div class="kpi"><div class="kl">'+l+'</div><div class="kv" style="color:'+c+'">'+v+'</div><div class="ks">'+s+'</div></div>';}
function kpi2(l,v,s,c){return '<div class="kpi"><div class="kl">'+l+'</div><div class="kv" style="color:'+c+'">'+v+'</div><div class="ks">'+s+'</div></div>';}

function renderTable(){
  E('tbody').innerHTML=actifs.map(function(a,i){
    var c=calc(a);var hp=!!a.prixOffre;
    var cC=a.prixReventeConservateur?calc(a,a.prixReventeConservateur):null;
    var cT=a.prixReventeCible?calc(a,a.prixReventeCible):null;
    var tc=parseFloat(a.agenceTauxCommission)||0;
    var cc1=tc&&a.prixReventeConservateur?fmt(parseFloat(a.prixReventeConservateur)*tc/100):'';
    var cc2=tc&&a.prixReventeCible?fmt(parseFloat(a.prixReventeCible)*tc/100):'';
    var pvHtml='<span class="cd">—</span>';
    if(cC){pvHtml='<span class="'+(cC.pv>=0?'cv':'cr')+'">'+fmt(cC.pv)+'</span>';if(cT)pvHtml+=' <span class="cd">/</span> <span class="'+(cT.pv>=0?'cv':'cr')+'">'+fmt(cT.pv)+'</span>';}
    var mgHtml='<span class="cd">—</span>';
    if(cC){mgHtml='<span class="'+(cC.mg>=0?'cv':'cr')+'">'+fmtP(cC.mg)+'</span>';if(cT)mgHtml+=' <span class="cd">/</span> <span class="'+(cT.mg>=0?'cv':'cr')+'">'+fmtP(cT.mg)+'</span>';}
    var rvHtml='<span class="cd">—</span>';
    if(cC){rvHtml='<span class="cb">'+fmt(parseFloat(a.prixReventeConservateur))+'</span>';if(cT)rvHtml+=' <span class="cd">/</span> <span class="cor">'+fmt(parseFloat(a.prixReventeCible))+'</span>';}
    var agHtml='<span class="cd">—</span>';
    if(a.agenceNom){agHtml='<div style="font-size:11px;font-weight:500">'+esc(a.agenceNom)+'</div>';agHtml+=tc?'<div class="mono cor" style="font-size:10px">'+tc+'%</div>':'<div class="cd" style="font-size:10px">taux à renseigner</div>';if(tc&&(cc1||cc2))agHtml+='<div class="cd mono" style="font-size:10px">'+cc1+(cc1&&cc2?' / ':'')+cc2+'</div>';}
    var lnHtml='<span class="cd">—</span>';
    if(a.lienAnnonce)lnHtml='<a href="'+esc(a.lienAnnonce)+'" target="_blank" style="color:var(--or);font-size:11px;text-decoration:none;border:1px solid var(--gris3);padding:3px 8px;border-radius:3px">🔗 Voir</a>';
    return '<tr onclick="open2('+i+')">'
      +'<td><span class="mono cor">'+esc(a.ref||'—')+'</span></td>'
      +'<td><div style="font-weight:500">'+esc(a.adresse||'—')+'</div><div class="cd">'+esc(a.ville)+'</div></td>'
      +'<td class="cd">'+esc(a.typeImmeuble||'—')+'</td>'
      +'<td class="cd">'+esc(a.nature||'—')+'</td>'
      +'<td class="mono">'+(a.surface?esc(a.surface)+' m²':'<span class="cd">—</span>')+'</td>'
      +'<td class="mono">'+(hp?fmt(parseFloat(a.prixOffre)):'<span class="cd">—</span>')+'</td>'
      +'<td class="mono cd">'+(hp?fmt(c.m2):'—')+'</td>'
      +'<td class="mono">'+(a.travaux?fmt(parseFloat(a.travaux)):'<span class="cd">—</span>')+'</td>'
      +'<td class="mono">'+(hp?fmt(c.tot):'<span class="cd">—</span>')+'</td>'
      +'<td class="mono" style="font-size:11px">'+rvHtml+'</td>'
      +'<td class="mono" style="font-size:11px">'+pvHtml+'</td>'
      +'<td class="mono" style="font-size:11px">'+mgHtml+'</td>'
      +'<td><span class="badge '+sclass(a.statut)+'">'+slabel(a.statut)+'</span></td>'
      +'<td>'+agHtml+'</td>'
      +'<td onclick="event.stopPropagation()">'+lnHtml+'</td>'
      +'</tr>';
  }).join('');
}

function open2(i){cur=JSON.parse(JSON.stringify(actifs[i]));isNew=false;showModal();}
function openNew(){var n=actifs.length+1;cur=vide();cur.ref='ACT-'+String(n).padStart(3,'0');isNew=true;showModal();}
function closeModal(){E('modal').style.display='none';cur=null;}
function resetActif(){if(!cur)return;if(cur.id===1){cur=JSON.parse(JSON.stringify(DEF));showModal();}else if(cur.id===2){cur=JSON.parse(JSON.stringify(ACT002));showModal();}else{cur=Object.assign(vide(),{id:cur.id,ref:cur.ref});showModal();}}
function saveActif(){
  var copy = JSON.parse(JSON.stringify(cur));
  if(isNew) {
    insertActif(copy, function() {
      actifs.push(copy);
      save2LS();
      closeModal();
      render();
      showSync(true);
    });
  } else {
    var i = actifs.findIndex(function(a){return a.id===cur.id;});
    if(i>=0) actifs[i] = copy;
    updateActif(copy, function() {
      save2LS();
      closeModal();
      render();
      showSync(true);
    });
  }
}

function set2(k,v){cur[k]=v;refreshCalc();}
function setB(k,v){cur[k]=v;showModal();}

function showModal(){
  E('mod-title').textContent=cur.ref||'Nouvel actif';
  E('mod-sub').textContent=[cur.adresse,cur.ville].filter(Boolean).join(' — ');
  E('mod-body').innerHTML=buildBody();
  E('modal').style.display='flex';
}

function refreshCalc(){
  var el=E('zone-calc');if(el)el.innerHTML=buildCalc();
}

function buildCalc(){
  var a=cur;
  var c=calc(a,a.prixReventeConservateur||a.prixOffre||'0');
  var cC=a.prixReventeConservateur?calc(a,a.prixReventeConservateur):null;
  var cT=a.prixReventeCible?calc(a,a.prixReventeCible):null;
  var tR=parseFloat(a.tauxAgenceRevente)/100||0.05;
  var tC=parseFloat(a.agenceTauxCommission)||0;

  var lignes=[
    ["Prix d'achat",parseFloat(a.prixOffre)||0],
    ["Frais agence achat",c.fAA],["Frais de notaire",c.fN],
    ["Travaux & équipements",parseFloat(a.travaux)||0],
    ["Frais bancaires",c.fB],["Frais hypothèque",c.fH],
    ["Levée hypothèque",c.fLH],["Frais SEP",c.fSEP],
    ["Frais courants",c.fC],["Frais spéciaux",c.fS]
  ];
  var h='<div class="st">Récapitulatif des coûts</div>';
  lignes.forEach(function(l){h+='<div class="cr2"><span style="color:var(--mid)">'+l[0]+'</span><span class="mono">'+fmt(l[1])+'</span></div>';});
  h+='<div class="cr2 ctot"><span>TOTAL COÛT</span><span class="mono">'+fmt(c.tot)+'</span></div>';

  if(cC||cT){
    h+='<div class="st" style="margin-top:16px">Résultats — Comparaison scénarios</div>';
    h+='<div class="rtw"><table class="rt"><thead><tr>';
    h+='<th style="text-align:left;color:var(--dim)"></th>';
    h+='<th style="text-align:right;color:var(--bleu)">Conservateur</th>';
    h+='<th style="text-align:right;color:var(--or)">Cible</th>';
    h+='</tr></thead><tbody>';
    var rows=[
      ["Prix de revente",cC?fmt(parseFloat(a.prixReventeConservateur)):'—',cT?fmt(parseFloat(a.prixReventeCible)):'—',false],
      ["Frais agence revente",cC?fmt(parseFloat(a.prixReventeConservateur)*tR):'—',cT?fmt(parseFloat(a.prixReventeCible)*tR):'—',false],
      ["Prix net vendeur",cC?fmt(parseFloat(a.prixReventeConservateur)*(1-tR)):'—',cT?fmt(parseFloat(a.prixReventeCible)*(1-tR)):'—',false],
      ["Plus-value",cC?fmt(cC.pv):'—',cT?fmt(cT.pv):'—',true],
      ["Marge %",cC?fmtP(cC.mg):'—',cT?fmtP(cT.mg):'—',true]
    ];
    rows.forEach(function(r){
      var vc=r[3]&&cC?(cC.pv>=0?'var(--vert)':'var(--rouge)'):'var(--blanc)';
      var vt=r[3]&&cT?(cT.pv>=0?'var(--vert)':'var(--rouge)'):'var(--blanc)';
      h+='<tr><td style="color:var(--mid);font-family:Sora,sans-serif;font-size:11px">'+r[0]+'</td>';
      h+='<td style="text-align:right;color:'+vc+'">'+r[1]+'</td>';
      h+='<td style="text-align:right;color:'+vt+'">'+r[2]+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }

  if(tC&&(a.prixReventeConservateur||a.prixReventeCible)){
    h+='<div class="st" style="margin-top:8px">Commission agent</div>';
    h+='<div class="dv" style="font-size:11px">';
    if(a.prixReventeConservateur)h+='<span class="cb">Cons: '+fmt(parseFloat(a.prixReventeConservateur)*tC/100)+'</span>';
    if(a.prixReventeConservateur&&a.prixReventeCible)h+=' / ';
    if(a.prixReventeCible)h+='<span class="cor">Cible: '+fmt(parseFloat(a.prixReventeCible)*tC/100)+'</span>';
    h+='</div>';
  }
  return h;
}

function inp(label,key,val,type,ph,sty){
  type=type||'text';ph=ph||'';sty=sty||'font-family:DM Mono,monospace';
  var sv=String(val||'').replace(/"/g,'&quot;');
  return '<div class="fld"><label>'+label+'</label><input type="'+type+'" value="'+sv+'" placeholder="'+ph+'" style="'+sty+'" oninput="set2(\''+key+'\',this.value)"/></div>';
}

function buildBody(){
  var a=cur;
  var ss=['offre','acceptee','refusee','suivi'];
  var h='';

  // Statut
  h+='<div><div class="st">Statut de l\'offre</div><div class="ss">';
  ss.forEach(function(s){h+='<div class="so'+(a.statut===s?' so-'+s:'')+'" onclick="setB(\'statut\',\''+s+'\')">'+slabel(s)+'</div>';});
  h+='</div></div>';

  // Descriptif
  h+='<div><div class="st">Descriptif du bien</div><div class="g3">';
  h+=inp('Référence','ref',a.ref,'text','','font-family:Sora,sans-serif');
  h+=inp('Nature','nature',a.nature,'text','Immeuble, Maison…','font-family:Sora,sans-serif');
  h+=inp("Type d'immeuble",'typeImmeuble',a.typeImmeuble||'','text','Haussmannien…','font-family:Sora,sans-serif');
  h+=inp('Adresse','adresse',a.adresse,'text','','font-family:Sora,sans-serif');
  h+=inp('Ville','ville',a.ville,'text','','font-family:Sora,sans-serif');
  h+=inp('Surface actuelle (m²)','surface',a.surface,'number');
  h+=inp('Surface après travaux (m²)','surfaceApres',a.surfaceApres,'number');
  h+='</div></div>';

  // Acquisition
  h+='<div><div class="st">Acquisition</div><div class="g3">';
  h+=inp("Prix d'offre (€)",'prixOffre',a.prixOffre,'number');
  h+=inp('Frais agence achat (%)','tauxAgenceAchat',a.tauxAgenceAchat,'number');
  h+=inp('Frais notaire (%)','tauxNotaire',a.tauxNotaire,'number');
  h+=inp('Travaux + mobilier (€)','travaux',a.travaux,'number');
  h+=inp('Frais bancaires (%/an)','tauxBancaire',a.tauxBancaire,'number');
  h+=inp('Hypothèque (%)','tauxHypotheque',a.tauxHypotheque,'number');
  h+=inp('Levée hypothèque (€)','fraisLeveeHypotheque',a.fraisLeveeHypotheque,'number');
  h+=inp('Frais SEP (%)','tauxSEP',a.tauxSEP,'number');
  h+='</div></div>';

  // Frais courants
  h+='<div><div class="st">Frais courants</div><div class="g2">';
  h+=inp('Taxe foncière (€/an)','taxeFonciere',a.taxeFonciere,'number');
  h+=inp('Charges + électricité (€/an)','charges',a.charges,'number');
  h+='</div></div>';

  // Frais spéciaux
  var fs=[['geometre','coutGeometre','Géomètre (€)','996'],['ingenieurBeton','coutIngenieur','Ingénieur béton (€)',''],['age','coutAGE','AGE (€)',''],['rachatPartieCommune','coutRachat','Rachat partie commune (€)','1000'],['modificationRCP','coutRCP','Modification RCP (€)',''],['permisConstructire','coutPermis','Permis de construire (€)','']];
  h+='<div><div class="st">Frais spéciaux (cocher si applicable)</div><div style="display:flex;flex-direction:column;gap:8px">';
  fs.forEach(function(f){
    h+='<div style="display:flex;align-items:center;gap:12px">';
    h+='<label class="cbr"><input type="checkbox" '+(a[f[0]]?'checked':'')+' onchange="setB(\''+f[0]+'\',this.checked)"> '+f[2]+'</label>';
    if(a[f[0]])h+='<div style="flex:1">'+inp('',f[1],a[f[1]],'number',f[3])+'</div>';
    h+='</div>';
  });
  h+='</div></div>';

  // Agent
  h+='<div><div class="st">Agent — Commercialisation à la revente</div><div class="g3">';
  h+=inp("Nom de l'agence",'agenceNom',a.agenceNom||'','text','Agence XYZ','font-family:Sora,sans-serif');
  h+=inp('Commission (%)','agenceTauxCommission',a.agenceTauxCommission||'','number','ex: 4');
  h+='<div class="fld"><label>Mandats à émettre</label><div class="dv" style="font-size:11px;color:var(--mid)">F5 — 115 m² (RDC)<br>F3 — 43 m² (étage)</div></div>';
  h+='</div></div>';

  // Revente
  h+='<div><div class="st">Revente</div><div class="g3">';
  h+=inp('Prix conservateur (€)','prixReventeConservateur',a.prixReventeConservateur||'','number');
  h+=inp('Prix cible (€)','prixReventeCible',a.prixReventeCible||'','number');
  h+=inp('Frais agence revente (%)','tauxAgenceRevente',a.tauxAgenceRevente,'number');
  h+='</div></div>';

  // Zone calculs dynamiques
  h+='<div id="zone-calc">'+buildCalc()+'</div>';

  // Lien annonce
  h+='<div><div class="st">Lien annonce</div><div class="fld"><label>URL de l\'annonce</label>';
  h+='<input type="url" value="'+esc(a.lienAnnonce||'')+'" placeholder="https://..." style="font-family:Sora,sans-serif" oninput="set2(\'lienAnnonce\',this.value)"/>';
  if(a.lienAnnonce)h+='<a href="'+esc(a.lienAnnonce)+'" target="_blank" style="color:var(--or);font-size:11px;margin-top:4px;display:inline-block">Ouvrir l\'annonce</a>';
  h+='</div></div>';

  // Notes
  h+='<div><div class="st">Notes</div><div class="fld"><textarea oninput="set2(\'notes\',this.value)">'+esc(a.notes||'')+'</textarea></div></div>';

  return h;
}

// Événements
E('btn-nouveau').onclick=openNew;
E('btn-fermer').onclick=closeModal;
E('btn-annuler').onclick=closeModal;
E('btn-reset').onclick=resetActif;
E('btn-save').onclick=saveActif;
E('modal').onclick=function(e){if(e.target===this)closeModal();};

load();
</script>
</body>
</html>
