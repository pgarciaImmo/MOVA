.agent-panel{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:flex-end;justify-content:center;padding:20px}
.agent-box{background:var(--gris);border:1px solid var(--gris3);border-radius:12px 12px 0 0;width:100%;max-width:700px;max-height:88vh;overflow-y:auto}
.agent-box-hdr{padding:20px 24px;border-bottom:1px solid var(--gris3);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--gris);z-index:1}

.btn-ia:hover{opacity:.85}
.btn-ia:disabled{background:var(--gris3);color:var(--dim);cursor:not-allowed}
@keyframes pulse{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>

function renderKPI(){var n=actifs.length;var tot=actifs.reduce(function(s,a){return s+(parseFloat(a.prixOffre)||0);},0);var vo=0,no=0,va=0,na=0,vs=0,ns=0;actifs.forEach(function(a){var p=parseFloat(a.prixOffre)||0;if(a.statut==='offre'){vo+=p;no++;}if(a.statut==='acceptee'){va+=p;na++;}if(a.statut==='suivi'){vs+=p;ns++;}});var pvc=0,pvt=0,msc=0,mst=0,nc=0,nt=0;actifs.forEach(function(a){if(a.prixReventeConservateur){var c=calc(a,a.prixReventeConservateur);pvc+=c.pv;msc+=c.mg;nc++;}if(a.prixReventeCible){var c=calc(a,a.prixReventeCible);pvt+=c.pv;mst+=c.mg;nt++;}});var mc=nc>0?msc/nc:null;var mt=nt>0?mst/nt:null;var mp=0.20;E('kpis').innerHTML='<div class="kpi"><div class="kl">Actifs suivis</div><div class="kv">'+n+'</div><div class="ks">'+fmt(tot)+' au total</div></div>'+'<div class="kpi"><div class="kl">En offre</div><div class="kv" style="color:var(--bleu)">'+fmt(vo)+'</div><div class="ks">'+no+' bien'+(no>1?'s':'')+' en attente</div></div>'+'<div class="kpi"><div class="kl">Acceptés</div><div class="kv" style="color:var(--vert)">'+fmt(va)+'</div><div class="ks">'+na+' bien'+(na>1?'s':'')+' validé'+(na>1?'s':'')+'</div></div>'+'<div class="kpi"><div class="kl">En transformation</div><div class="kv" style="color:var(--or)">'+fmt(vs)+'</div><div class="ks">'+ns+' bien'+(ns>1?'s':'')+' en cours</div></div>'+'<div class="kpi"><div class="kl">Plus-value estimée</div><div style="margin-top:4px"><div class="kls cb">Conservatrice</div><div class="kvs '+(pvc>=0?'cv':'cr')+'">'+fmt(pvc)+'</div><div class="ks">marge moy. '+(mc!==null?fmtP(mc):'—')+'</div><div class="kdiv"><div class="kls cor">Cible</div><div class="kvs '+(pvt>=0?'cv':'cr')+'">'+fmt(pvt)+'</div><div class="ks">marge moy. '+(mt!==null?fmtP(mt):'—')+'</div></div></div></div>'+'<div class="kpi"><div class="kl">Ma marge (20%)</div><div style="margin-top:4px"><div class="kls cb">Conservatrice</div><div class="kvs '+(pvc>=0?'cv':'cr')+'">'+fmt(pvc*mp)+'</div><div class="ks">sur 20% de la PV</div><div class="kdiv"><div class="kls cor">Cible</div><div class="kvs '+(pvt>=0?'cv':'cr')+'">'+fmt(pvt*mp)+'</div><div class="ks">sur 20% de la PV</div></div></div></div>';E('th2').textContent='Actifs — '+n+' bien'+(n>1?'s':'');}

function renderTable(){E('tbody').innerHTML=actifs.map(function(a,i){var c=calc(a);var hp=!!a.prixOffre;var cC=a.prixReventeConservateur?calc(a,a.prixReventeConservateur):null;var cT=a.prixReventeCible?calc(a,a.prixReventeCible):null;var tc=parseFloat(a.agenceTauxCommission)||0;var pvH='<span class="cd">—</span>';if(cC){pvH='<span class="'+(cC.pv>=0?'cv':'cr')+'">'+fmt(cC.pv)+'</span>';if(cT)pvH+=' <span class="cd">/</span> <span class="'+(cT.pv>=0?'cv':'cr')+'">'+fmt(cT.pv)+'</span>';}var mgH='<span class="cd">—</span>';if(cC){mgH='<span class="'+(cC.mg>=30?'cv':'cr')+'">'+fmtP(cC.mg)+'</span>';if(cT)mgH+=' <span class="cd">/</span> <span class="'+(cT.mg>=30?'cv':'cr')+'">'+fmtP(cT.mg)+'</span>';}var rvH='<span class="cd">—</span>';if(cC){rvH='<span class="cb">'+fmt(parseFloat(a.prixReventeConservateur))+'</span>';if(cT)rvH+=' <span class="cd">/</span> <span class="cor">'+fmt(parseFloat(a.prixReventeCible))+'</span>';}var agH='<span class="cd">—</span>';if(a.agenceNom){agH='<div style="font-size:11px;font-weight:500">'+esc(a.agenceNom)+'</div>';agH+=tc?'<div class="mono cor" style="font-size:10px">'+tc+'%</div>':'<div class="cd" style="font-size:10px">taux à renseigner</div>';}var lnH='<span class="cd">—</span>';if(a.lienAnnonce)lnH='<a href="'+esc(a.lienAnnonce)+'" target="_blank" style="color:var(--or);font-size:11px;text-decoration:none;border:1px solid var(--gris3);padding:3px 8px;border-radius:3px">🔗 Voir</a>';return '<tr onclick="open2('+i+')">'+'<td><span class="mono cor">'+esc(a.ref||'—')+'</span></td>'+'<td><div style="font-weight:500">'+esc(a.adresse||'—')+'</div><div class="cd">'+esc(a.ville)+'</div></td>'+'<td class="cd">'+esc(a.typeImmeuble||'—')+'</td>'+'<td class="cd">'+esc(a.nature||'—')+'</td>'+'<td class="mono">'+(a.surface?esc(a.surface)+' m²':'<span class="cd">—</span>')+'</td>'+'<td class="mono" style="font-size:11px;color:var(--dim)">'+(a.prixAffiche?fmt(parseFloat(a.prixAffiche)):'<span class="cd">—</span>')+'</td>'+'<td class="mono">'+(hp?fmt(parseFloat(a.prixOffre)):'<span class="cd">—</span>')+'</td>'+'<td class="mono cd">'+(hp?fmt(c.m2):'—')+'</td>'+'<td class="mono">'+(a.travaux?fmt(parseFloat(a.travaux)):'<span class="cd">—</span>')+'</td>'+'<td class="mono">'+(hp?fmt(c.tot):'<span class="cd">—</span>')+'</td>'+'<td class="mono" style="font-size:11px">'+rvH+'</td>'+'<td class="mono" style="font-size:11px">'+pvH+'</td>'+'<td class="mono" style="font-size:11px">'+mgH+'</td>'+'<td><span class="badge '+sclass(a.statut)+'">'+slabel(a.statut)+'</span></td>'+'<td>'+agH+'</td>'+'<td onclick="event.stopPropagation()">'+lnH+'</td>'+'</tr>';}).join('');}

function open2(i){cur=JSON.parse(JSON.stringify(actifs[i]));isNew=false;showModal();}
function openNew(){var n=actifs.length+1;cur=vide();cur.ref='ACT-'+String(n).padStart(3,'0');isNew=true;showModal();}
function closeModal(){E('modal').style.display='none';cur=null;}
function resetActif(){if(!cur)return;if(cur.id===1){cur=JSON.parse(JSON.stringify(DEF));showModal();}else if(cur.id===2){cur=JSON.parse(JSON.stringify(ACT002));showModal();}else if(cur.id===3){cur=JSON.parse(JSON.stringify(ACT003));showModal();}else{cur=Object.assign(vide(),{id:cur.id,ref:cur.ref});showModal();}}
function saveActif(){var copy=JSON.parse(JSON.stringify(cur));if(isNew){insertActif(copy,function(){actifs.push(copy);closeModal();render();});}else{var i=actifs.findIndex(function(a){return a.id===cur.id;});if(i>=0)actifs[i]=copy;updateActif(copy,function(){closeModal();render();});}}
function set2(k,v){cur[k]=v;refreshCalc();}
function setB(k,v){cur[k]=v;showModal();}
function showModal(){E('mod-title').textContent=cur.ref||'Nouvel actif';E('mod-sub').textContent=[cur.adresse,cur.ville].filter(Boolean).join(' — ');E('mod-body').innerHTML=buildBody();E('modal').style.display='flex';}
function refreshCalc(){var el=E('zone-calc');if(el)el.innerHTML=buildCalc();}

function buildCalc(){var a=cur;var c=calc(a,a.prixReventeConservateur||a.prixOffre||'0');var cC=a.prixReventeConservateur?calc(a,a.prixReventeConservateur):null;var cT=a.prixReventeCible?calc(a,a.prixReventeCible):null;var tR=parseFloat(a.tauxAgenceRevente)/100||0.05;var tC=parseFloat(a.agenceTauxCommission)||0;var lignes=[["Prix d'achat",parseFloat(a.prixOffre)||0],["Frais agence achat",c.fAA],["Frais de notaire",c.fN],["Travaux & équipements",parseFloat(a.travaux)||0],["Frais bancaires",c.fB],["Frais hypothèque",c.fH],["Levée hypothèque",c.fLH],["Frais SEP",c.fSEP],["Frais courants",c.fC],["Frais spéciaux",c.fS]];var h='<div class="st">Récapitulatif des coûts</div>';lignes.forEach(function(l){h+='<div class="cr2"><span style="color:var(--mid)">'+l[0]+'</span><span class="mono">'+fmt(l[1])+'</span></div>';});h+='<div class="cr2 ctot"><span>TOTAL COÛT</span><span class="mono">'+fmt(c.tot)+'</span></div>';if(cC||cT){h+='<div class="st" style="margin-top:16px">Résultats — Comparaison scénarios</div><div class="rtw"><table class="rt"><thead><tr><th style="text-align:left;color:var(--dim)"></th><th style="text-align:right;color:var(--bleu)">Conservateur</th><th style="text-align:right;color:var(--or)">Cible</th></tr></thead><tbody>';var rows=[["Prix de revente",cC?fmt(parseFloat(a.prixReventeConservateur)):'—',cT?fmt(parseFloat(a.prixReventeCible)):'—',false],["Frais agence revente",cC?fmt(parseFloat(a.prixReventeConservateur)*tR):'—',cT?fmt(parseFloat(a.prixReventeCible)*tR):'—',false],["Prix net vendeur",cC?fmt(parseFloat(a.prixReventeConservateur)*(1-tR)):'—',cT?fmt(parseFloat(a.prixReventeCible)*(1-tR)):'—',false],["Plus-value",cC?fmt(cC.pv):'—',cT?fmt(cT.pv):'—',true],["Marge %",cC?fmtP(cC.mg):'—',cT?fmtP(cT.mg):'—',true]];rows.forEach(function(r){var vc=r[3]&&cC?(cC.pv>=0?'var(--vert)':'var(--rouge)'):'var(--blanc)';var vt=r[3]&&cT?(cT.pv>=0?'var(--vert)':'var(--rouge)'):'var(--blanc)';h+='<tr><td style="color:var(--mid);font-family:Sora,sans-serif;font-size:11px">'+r[0]+'</td><td style="text-align:right;color:'+vc+'">'+r[1]+'</td><td style="text-align:right;color:'+vt+'">'+r[2]+'</td></tr>';});h+='</tbody></table></div>';}if(tC&&(a.prixReventeConservateur||a.prixReventeCible)){h+='<div class="st" style="margin-top:8px">Commission agent</div><div class="dv" style="font-size:11px">';if(a.prixReventeConservateur)h+='<span class="cb">Cons: '+fmt(parseFloat(a.prixReventeConservateur)*tC/100)+'</span>';if(a.prixReventeConservateur&&a.prixReventeCible)h+=' / ';if(a.prixReventeCible)h+='<span class="cor">Cible: '+fmt(parseFloat(a.prixReventeCible)*tC/100)+'</span>';h+='</div>';}return h;}

function inp(label,key,val,type,ph,sty){type=type||'text';ph=ph||'';sty=sty||'font-family:DM Mono,monospace';var sv=String(val||'').replace(/"/g,'&quot;');return '<div class="fld"><label>'+label+'</label><input type="'+type+'" value="'+sv+'" placeholder="'+ph+'" style="'+sty+'" oninput="set2(\''+key+'\',this.value)"/></div>';}

function buildBody(){var a=cur;var ss=['offre','acceptee','refusee','suivi'];var h='';h+='<div><div class="st">Statut de l\'offre</div><div class="ss">';ss.forEach(function(s){h+='<div class="so'+(a.statut===s?' so-'+s:'')+'" onclick="setB(\'statut\',\''+s+'\')">'+slabel(s)+'</div>';});h+='</div></div>';h+='<div><div class="st">Descriptif du bien</div><div class="g3">'+inp('Référence','ref',a.ref,'text','','font-family:Sora,sans-serif')+inp('Nature','nature',a.nature,'text','Immeuble, Maison…','font-family:Sora,sans-serif')+inp("Type d'immeuble",'typeImmeuble',a.typeImmeuble||'','text','Haussmannien…','font-family:Sora,sans-serif')+inp('Adresse','adresse',a.adresse,'text','','font-family:Sora,sans-serif')+inp('Ville','ville',a.ville,'text','','font-family:Sora,sans-serif')+inp('Surface actuelle (m²)','surface',a.surface,'number')+inp('Surface après travaux (m²)','surfaceApres',a.surfaceApres,'number')+'</div></div>';h+='<div><div class="st">Acquisition</div><div class="g3">'+inp('Prix affiché vendeur (€)','prixAffiche',a.prixAffiche||'','number')+inp("Prix d'offre (€)",'prixOffre',a.prixOffre,'number')+inp('Frais agence achat (%)','tauxAgenceAchat',a.tauxAgenceAchat,'number')+inp('Frais notaire (%)','tauxNotaire',a.tauxNotaire,'number')+inp('Travaux + mobilier (€)','travaux',a.travaux,'number')+inp('Frais bancaires (%/an)','tauxBancaire',a.tauxBancaire,'number')+inp('Hypothèque (%)','tauxHypotheque',a.tauxHypotheque,'number')+inp('Levée hypothèque (€)','fraisLeveeHypotheque',a.fraisLeveeHypotheque,'number')+inp('Frais SEP (%)','tauxSEP',a.tauxSEP,'number')+'</div></div>';h+='<div><div class="st">Frais courants</div><div class="g2">'+inp('Taxe foncière (€/an)','taxeFonciere',a.taxeFonciere,'number')+inp('Charges + électricité (€/an)','charges',a.charges,'number')+'</div></div>';var fs=[['geometre','coutGeometre','Géomètre (€)','996'],['ingenieurBeton','coutIngenieur','Ingénieur béton (€)',''],['age','coutAGE','AGE (€)',''],['rachatPartieCommune','coutRachat','Rachat partie commune (€)','1000'],['modificationRCP','coutRCP','Modification RCP (€)',''],['permisConstructire','coutPermis','Permis de construire (€)','']];h+='<div><div class="st">Frais spéciaux</div><div style="display:flex;flex-direction:column;gap:8px">';fs.forEach(function(f){h+='<div style="display:flex;align-items:center;gap:12px"><label class="cbr"><input type="checkbox" '+(a[f[0]]?'checked':'')+' onchange="setB(\''+f[0]+'\',this.checked)"> '+f[2]+'</label>';if(a[f[0]])h+='<div style="flex:1">'+inp('',f[1],a[f[1]],'number',f[3])+'</div>';h+='</div>';});h+='</div></div>';h+='<div><div class="st">Agent — Revente</div><div class="g3">'+inp("Nom de l'agence",'agenceNom',a.agenceNom||'','text','Agence XYZ','font-family:Sora,sans-serif')+inp('Commission (%)','agenceTauxCommission',a.agenceTauxCommission||'','number','ex: 4')+'<div class="fld"><label>Mandats à émettre</label><div class="dv" style="font-size:11px;color:var(--mid)">F5 — 115 m² (RDC)<br>F3 — 43 m² (étage)</div></div></div></div>';h+='<div><div class="st">Revente</div><div class="g3">'+inp('Prix conservateur (€)','prixReventeConservateur',a.prixReventeConservateur||'','number')+inp('Prix cible (€)','prixReventeCible',a.prixReventeCible||'','number')+inp('Frais agence revente (%)','tauxAgenceRevente',a.tauxAgenceRevente,'number')+'</div></div>';h+='<div id="zone-calc">'+buildCalc()+'</div>';h+='<div><div class="st">Lien annonce</div><div class="fld"><label>URL</label><input type="url" value="'+esc(a.lienAnnonce||'')+'" placeholder="https://..." style="font-family:Sora,sans-serif" oninput="set2(\'lienAnnonce\',this.value)"/>';if(a.lienAnnonce)h+='<a href="'+esc(a.lienAnnonce)+'" target="_blank" style="color:var(--or);font-size:11px;margin-top:4px;display:inline-block">Ouvrir l&apos;annonce</a>';h+='</div></div>';h+='<div><div class="st">Notes</div><div class="fld"><textarea oninput="set2(\'notes\',this.value)">'+esc(a.notes||'')+'</textarea></div></div>';return h;}

function openAgentsPanel(){var g=E('agents-grid');if(!g)return;g.innerHTML=agentsDefs.map(function(a){return '<div class="agent-card" onclick="openAgentAction('+a.id+')">'+'<div class="agent-card-top">'+'<div class="agent-icon">'+a.icon+'</div>'+'<div class="agent-num">Agent '+a.num+'</div>'+'<div class="agent-name">'+a.nom+'</div>'+'<div class="agent-desc">'+a.desc+'</div>'+'</div>'+'<div class="agent-card-foot">'+'<span class="agent-status '+(a.status==='ok'?'status-ok':'status-no')+'">'+(a.status==='ok'?'● Disponible':'Bientôt')+'</span>'+(a.status==='ok'?'<button class="btn-utiliser" onclick="event.stopPropagation();openAgentAction('+a.id+')">Utiliser →</button>':'')+'</div></div>';}).join('');E('agents-overlay').style.display='flex';}

function buildAgentUI(id){var sel='<div class="fld"><label>Choisir un actif</label><select id="ag-actif" style="font-family:Sora,sans-serif">'+actifs.map(function(a){return '<option value="'+a.id+'">'+a.ref+(a.adresse?' — '+a.adresse:'')+'</option>';}).join('')+'</select></div>';if(id===1)return sel+'<div class="fld"><label>Infos complémentaires</label><input type="text" id="ag1-info" placeholder="ex: proche métro…" style="font-family:Sora,sans-serif"/></div><button class="btn-ia" onclick="lancerAnalyste()">Analyser le marché</button><div id="ag1-result"></div>';if(id===2)return sel+'<button class="btn-ia" onclick="lancerVerificateur()">Vérifier la rentabilité</button><div id="ag2-result"></div>';if(id===3)return sel+'<div class="fld"><label>Destinataire</label><input type="text" id="ag3-dest" placeholder="ex: M. Dupont" style="font-family:Sora,sans-serif"/></div><button class="btn-ia" onclick="lancerSynthese()">Générer la synthèse</button><div id="ag3-result"></div>';if(id===4)return sel+'<button class="btn-ia" onclick="lancerScore()">Scorer</button><div id="ag4-result"></div>';if(id===5)return '<div style="display:flex;flex-direction:column;gap:16px"><div class="g2"><div class="fld"><label>Zones</label><input type="text" id="ch-arr" value="Paris 16e, Paris 15e, Paris 11e, Versailles" style="font-family:Sora,sans-serif"/></div><div class="fld"><label>Surface min (m²)</label><input type="number" id="ch-surf" value="17"/></div></div><button class="btn-ia" id="ch-btn" onclick="lancerChasseur()">🔍 Lancer la chasse</button><div id="ch-result"></div></div>';return '<div style="color:var(--dim);padding:20px">Bientôt disponible.</div>';}

function getActif(){var sel=E('ag-actif');if(!sel)return actifs[0];var id=parseInt(sel.value);return actifs.find(function(a){return a.id===id;})||actifs[0];}

function callClaude(prompt,resId,btnTxt){
  var btn=document.querySelector('.btn-ia');if(btn){btn.disabled=true;btn.textContent='En cours…';}
  var el=E(resId);if(el)el.innerHTML='<div style="color:var(--dim);font-size:13px;padding:16px 0">Agent en cours de réflexion…</div>';
  fetch('https://movaapi.vercel.app/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:2000,messages:[{role:'user',content:prompt}]})})
  .then(function(r){return r.json();})
  .then(function(d){var txt=d.content&&d.content[0]?d.content[0].text:'Erreur.';if(el)el.innerHTML='<div style="background:var(--noir);border:1px solid var(--gris3);border-radius:var(--r);padding:20px;font-size:13px;line-height:1.8;color:var(--blanc);white-space:pre-wrap">'+esc(txt)+'</div><button onclick="navigator.clipboard.writeText(this.previousSibling.textContent)" style="margin-top:10px;background:none;border:1px solid var(--bleu);color:var(--bleu);border-radius:var(--r);padding:8px 16px;font-family:Sora,sans-serif;font-size:12px;cursor:pointer">📋 Copier</button>';if(btn){btn.disabled=false;btn.textContent=btnTxt;}})
  .catch(function(){if(el)el.innerHTML='<div style="color:var(--rouge);padding:14px;font-size:12px">Erreur de connexion.</div>';if(btn){btn.disabled=false;btn.textContent=btnTxt;}});
}

function lancerAnalyste(){var a=getActif();var info=(E('ag1-info')||{}).value||'';var c=calc(a);var p='Tu es un expert marchand de biens Paris Île-de-France.\n\nACTIF :\n- Adresse : '+(a.adresse||'?')+', '+(a.ville||'')+'\n- Type : '+(a.typeImmeuble||a.nature||'?')+' — '+(a.surface||'?')+' m²\n- Notes : '+(a.notes||'non renseignée')+'\n- Prix acquisition : '+fmt(parseFloat(a.prixOffre))+' ('+fmt(c.m2)+'/m²)\n- Travaux : '+fmt(parseFloat(a.travaux))+'\n'+(a.prixReventeConservateur?'- Revente cons : '+fmt(parseFloat(a.prixReventeConservateur))+'\n':'')+(a.prixReventeCible?'- Revente cible : '+fmt(parseFloat(a.prixReventeCible))+'\n':'')+(info?'- Infos : '+info+'\n':'')+'\nMODÈLE SPPE : notaire 3%, financement 7%/75%/7 mois, vente 2%, objectif 30% marge.\n\n1) Prix/m² secteur 2025\n2) Évaluation acquisition\n3) Réalisme revente\n4) Tendance 2025-2026\n5) Verdict VIABLE / RISQUÉE / DÉCONSEILLÉE\n\nMax 500 mots.';callClaude(p,'ag1-result','Nouvelle analyse');}

function lancerVerificateur(){var a=getActif();var c=calc(a);var cC=a.prixReventeConservateur?calc(a,a.prixReventeConservateur):null;var cT=a.prixReventeCible?calc(a,a.prixReventeCible):null;var p='Tu es expert marchand de biens.\n\nVÉRIFICATION FINANCIÈRE :\n- Bien : '+(a.adresse||'?')+', '+(a.ville||'')+'\n- Surface : '+(a.surface||'?')+' m²\n- Notes : '+(a.notes||'nc')+'\n- Prix achat : '+fmt(parseFloat(a.prixOffre))+' ('+fmt(c.m2)+'/m²)\n- Travaux : '+fmt(parseFloat(a.travaux))+'\n- Coût total : '+fmt(c.tot)+'\n- Notaire : '+fmt(c.fN)+'\n- Bancaires : '+fmt(c.fB)+'\n- SEP : '+fmt(c.fSEP)+'\n'+(cC?'- Cons : '+fmt(parseFloat(a.prixReventeConservateur))+' → PV '+fmt(cC.pv)+' ('+fmtP(cC.mg)+')\n':'')+(cT?'- Cible : '+fmt(parseFloat(a.prixReventeCible))+' → PV '+fmt(cT.pv)+' ('+fmtP(cT.mg)+')\n':'')+'\n1) Frais correctement estimés ?\n2) Postes oubliés ?\n3) Marge suffisante (seuil 30%) ?\n4) Risques ?\n5) Verdict VIABLE / RISQUÉE / DÉCONSEILLÉE';callClaude(p,'ag2-result','Nouvelle vérification');}

function lancerSynthese(){var a=getActif();var dest=(E('ag3-dest')||{}).value||'';var c=calc(a);var cC=a.prixReventeConservateur?calc(a,a.prixReventeConservateur):null;var cT=a.prixReventeCible?calc(a,a.prixReventeCible):null;var p='Rédige une note investisseur professionnelle.\n\nBIEN :\n- '+(a.adresse||'?')+', '+(a.ville||'')+'\n- '+(a.typeImmeuble||a.nature||'?')+' — '+(a.surface||'?')+' m²\n- Notes : '+(a.notes||'nc')+'\n- Acquisition : '+fmt(parseFloat(a.prixOffre))+'\n- Travaux : '+fmt(parseFloat(a.travaux))+'\n- Coût total : '+fmt(c.tot)+'\n'+(cC?'- Cons : '+fmt(parseFloat(a.prixReventeConservateur))+' → '+fmtP(cC.mg)+' (PV '+fmt(cC.pv)+')\n':'')+(cT?'- Cible : '+fmt(parseFloat(a.prixReventeCible))+' → '+fmtP(cT.mg)+' (PV '+fmt(cT.pv)+')\n':'')+(dest?'- Destinataire : '+dest+'\n':'')+'\nFormat : Introduction — Descriptif — Analyse financière — Points forts/risques — Conclusion. 400 mots max.';callClaude(p,'ag3-result','Nouvelle synthèse');}

function lancerScore(){
  var a=getActif();var c=calc(a);var cC=a.prixReventeConservateur?calc(a,a.prixReventeConservateur):null;var cT=a.prixReventeCible?calc(a,a.prixReventeCible):null;
  var p='Note cette opportunité de 1 à 10.\n\nBIEN :\n- '+(a.adresse||'?')+', '+(a.ville||'')+'\n- '+(a.surface||'?')+' m² — '+fmt(c.m2)+'/m²\n- Coût total : '+fmt(c.tot)+'\n'+(cC?'- Marge cons : '+fmtP(cC.mg)+'\n':'')+(cT?'- Marge cible : '+fmtP(cT.mg)+'\n':'')+'\nRéponds UNIQUEMENT en JSON sans backticks :\n{"rentabilite":X,"risque":X,"potentiel":X,"localisation":X,"score_global":X,"verdict":"texte","recommandation":"texte"}';
  var el=E('ag4-result');var btn=document.querySelector('.btn-ia');if(btn){btn.disabled=true;btn.textContent='Calcul…';}if(el)el.innerHTML='<div style="color:var(--dim);font-size:13px;padding:16px 0">Calcul du score…</div>';
  fetch('https://movaapi.vercel.app/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:500,messages:[{role:'user',content:p}]})})
  .then(function(r){return r.json();})
  .then(function(d){var txt=d.content&&d.content[0]?d.content[0].text:'{}';try{var dd=JSON.parse(txt.replace(/```json|```/g,'').trim());var sc=dd.score_global||0;var col=sc>=7?'var(--vert)':sc>=5?'var(--or)':'var(--rouge)';var items=[['Rentabilité',dd.rentabilite],['Risque',dd.risque],['Potentiel',dd.potentiel],['Localisation',dd.localisation]];var grid='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px">'+items.map(function(x){var c2=x[1]>=7?'var(--vert)':x[1]>=5?'var(--or)':'var(--rouge)';return '<div style="background:var(--noir);border:1px solid var(--gris3);border-radius:var(--r);padding:12px;text-align:center"><div style="font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:4px">'+x[0]+'</div><div style="font-family:DM Mono,monospace;font-size:22px;color:'+c2+'">'+x[1]+'/10</div></div>';}).join('')+'<div style="background:var(--noir);border:2px solid '+col+';border-radius:var(--r);padding:12px;text-align:center;grid-column:span 2"><div style="font-size:9px;text-transform:uppercase;color:var(--dim);margin-bottom:4px">Score global</div><div style="font-family:DM Mono,monospace;font-size:28px;color:'+col+'">'+sc+'/10</div></div></div>';if(el)el.innerHTML=grid+'<div style="background:var(--noir);border:1px solid var(--gris3);border-radius:var(--r);padding:16px;font-size:13px;line-height:1.7;color:var(--blanc)"><strong style="color:var(--or)">Verdict :</strong> '+esc(dd.verdict||'')+'\n\n<strong style="color:var(--or)">Recommandation :</strong> '+esc(dd.recommandation||'')+'</div>';}catch(e){if(el)el.innerHTML='<div style="background:var(--noir);border:1px solid var(--gris3);border-radius:var(--r);padding:16px;font-size:13px;color:var(--blanc);white-space:pre-wrap">'+esc(txt)+'</div>';}if(btn){btn.disabled=false;btn.textContent='Nouveau score';}})
  .catch(function(){if(el)el.innerHTML='<div style="color:var(--rouge);padding:10px;font-size:12px">Erreur.</div>';if(btn){btn.disabled=false;btn.textContent='Nouveau score';}});
}

function envoyerEmail(txt){fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:'service_mova',template_id:'template_mova',user_id:'EMAILJS_PUBLIC_KEY',template_params:{to_email:'paulo.garcia.expfrance@gmail.com',subject:'🔍 MOVA — Nouvelles opportunités',message:txt,date:new Date().toLocaleString('fr-FR')}})}).catch(function(){});}

function analyserDepuisChasseur(idx){
  var a=window._chasseurAnnonces&&window._chasseurAnnonces[idx];
  if(!a)return;
  var newActif=vide();
  newActif.ref='ACT-'+(actifs.length+1<10?'00':'0')+(actifs.length+1);
  newActif.adresse=a.adresse||'';
  newActif.ville=a.ville||'';
  newActif.surface=String(a.surface||'');
  newActif.prixOffre=String(a.prix||'');
  newActif.prixAffiche=String(a.prix||'');
  newActif.nature=a.type||'Appartement';
  newActif.travaux=String(Math.round((parseFloat(a.surface)||0)*1500));
  newActif.notes=a.description||'';
  newActif.lienAnnonce=a.lien||'';
  newActif.tauxNotaire='3';newActif.tauxBancaire='7';newActif.tauxHypotheque='1.5';newActif.fraisLeveeHypotheque='1500';newActif.tauxSEP='2';newActif.tauxAgenceRevente='5';newActif.tauxAgenceAchat='0';
  insertActif(newActif,function(){
    actifs.push(newActif);
    render();
    document.getElementById('agents-overlay').style.display='none';
    document.getElementById('agent-panel').style.display='none';
    setTimeout(function(){
      openAgentsPanel();
      setTimeout(function(){openAgentAction(1);},300);
    },200);
  });
}

function lancerChasseur(){
  var arr=(E('ch-arr')||{}).value||'Paris 16e, Paris 15e, Paris 11e';
  var surf=(E('ch-surf')||{}).value||'17';
  var el=E('ch-result');var btn=E('ch-btn');
  if(btn){btn.disabled=true;btn.textContent='Recherche en cours…';}
  if(el)el.innerHTML='<div style="color:#4A6A8A;font-size:13px;padding:16px 0">Chasseur en cours de recherche…</div>';
  var prompt='Zones : '+arr+'\nSurface min : '+surf+'m\u00b2';
  fetch('https://movaapi.vercel.app/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tools:[{"type":"web_search_20250305","name":"web_search"}],messages:[{role:'user',content:prompt}]})})
  .then(function(r){return r.json();})
  .then(function(d){
    var txt='';if(d.content)d.content.forEach(function(b){if(b.type==='text')txt+=b.text;});
    try{
      var clean=txt.replace(/```json|```/g,'').trim();
      var jsonMatch=clean.match(/\{[\s\S]*"annonces"[\s\S]*\}/);
      if(jsonMatch)clean=jsonMatch[0];
      var data=JSON.parse(clean);
      if(data.debug){
        if(el)el.innerHTML='<div style="background:#FDECEA;border:1px solid #C0392B;border-radius:10px;padding:16px;font-size:12px;color:#C0392B">Erreur: '+esc(data.debug)+'</div>';
        if(btn){btn.disabled=false;btn.textContent='Nouvelle recherche';}
        return;
      }
      if(!data.annonces||data.annonces.length===0){
        if(el)el.innerHTML='<div style="background:#F0F7FF;border:1px solid #BDD5EE;border-radius:10px;padding:16px;font-size:13px;color:#1A3A5C">Aucune annonce trouvée pour cette zone. Essaie une autre zone ou relance la recherche.</div>';
        if(btn){btn.disabled=false;btn.textContent='Nouvelle recherche';}
        return;
      }
      window._chasseurAnnonces=data.annonces||[];
      var html='<div style="display:flex;flex-direction:column;gap:16px;margin-top:12px">';
      (data.annonces||[]).forEach(function(a,i){
        var pm2=a.prix_m2?(Number(a.prix_m2).toLocaleString('fr-FR')+' €/m²'):'—';
        var px=a.prix&&a.prix>0?fmt(a.prix):'Prix non communiqué';
        html+='<div style="background:#fff;border:1px solid #BDD5EE;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(26,58,92,.06)">'
          +'<div style="background:#1A5FA8;padding:6px 16px;display:flex;justify-content:space-between;align-items:center">'
          +'<span style="color:#fff;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px">'+esc(a.type||'Appartement')+'</span>'
          +(a.surface?'<span style="color:#C2DFF5;font-size:11px;font-family:DM Mono,monospace">'+a.surface+' m²</span>':'')
          +'</div>'
          +'<div style="padding:16px">'
          +'<div style="font-size:15px;font-weight:700;color:#1A3A5C;margin-bottom:2px">'+esc(a.adresse||'Adresse non précisée')+'</div>'
          +'<div style="font-size:12px;color:#4A6A8A;margin-bottom:12px">'+esc(a.ville||'')+'</div>'
          +'<div style="display:flex;gap:24px;align-items:baseline;margin-bottom:12px;padding:10px 14px;background:#EEF4FB;border-radius:8px">'
          +'<div><div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#4A6A8A">Prix</div><div style="font-family:DM Mono,monospace;font-size:18px;font-weight:700;color:#1A5FA8">'+px+'</div></div>'
          +'<div><div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#4A6A8A">Prix/m²</div><div style="font-family:DM Mono,monospace;font-size:14px;color:#1A3A5C">'+pm2+'</div></div>'
          +'</div>'
          +(a.description?'<div style="font-size:12px;color:#4A6A8A;line-height:1.6;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #E0EEF8">'+esc(a.description)+'</div>':'')
          +'<div style="display:flex;gap:10px;align-items:center">'
          +(a.lien?'<a href="'+esc(a.lien)+'" target="_blank" style="font-size:12px;font-weight:600;color:#1A5FA8;border:1px solid #1A5FA8;border-radius:8px;padding:8px 14px;text-decoration:none;font-family:Sora,sans-serif">🔗 Voir l&apos;annonce</a>':'')
          +'<button onclick="analyserDepuisChasseur('+i+')" style="background:#1A5FA8;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-family:Sora,sans-serif;font-size:12px;font-weight:600;cursor:pointer;flex:1">📊 Analyser cette opportunité →</button>'
          +'</div>'
          +'</div>'
          +'</div>';
      });
      html+='</div>';
      if(el)el.innerHTML=html;
      envoyerEmail(txt);
    }catch(e){
      if(el)el.innerHTML='<div style="background:#F8FBFF;border:1px solid #BDD5EE;border-radius:10px;padding:20px;font-size:13px;line-height:1.8;color:#1A3A5C;white-space:pre-wrap">'+esc(txt)+'</div>';
    }
    if(btn){btn.disabled=false;btn.textContent='Nouvelle recherche';}
  })
  .catch(function(){if(el)el.innerHTML='<div style="color:#C0392B;padding:14px;font-size:12px">Erreur de connexion.</div>';if(btn){btn.disabled=false;btn.textContent='Nouvelle recherche';}});
}

load();
</script>
