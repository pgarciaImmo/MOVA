<!DOCTYPE html>
<html lang="fr">
<head>

<title>MOVA — Rentabilité Immobilière</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--noir:#0a0a0a;--blanc:#f5f3ee;--or:#c9a84c;--gris:#1e1e1e;--gris2:#2c2c2c;--gris3:#3a3a3a;--dim:#888;--mid:#bbb;--vert:#4caf7d;--rouge:#e05a5a;--bleu:#5a9ce0;--r:6px}
body{background:var(--noir);color:var(--blanc);font-family:'Sora',sans-serif;min-height:100vh}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid #1a1a1a}
.logo{font-family:'DM Serif Display',serif;font-size:26px;color:var(--or);letter-spacing:2px}
.logo span{color:var(--blanc);font-size:13px;font-weight:300;margin-left:10px;opacity:.5}
.bp{background:var(--or);color:var(--noir);border:none;border-radius:var(--r);padding:9px 20px;font-family:'Sora',sans-serif;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:1px;text-transform:uppercase}
.bp:hover{opacity:.85}
.bs{background:none;border:1px solid var(--gris3);color:var(--mid);border-radius:var(--r);padding:9px 18px;font-family:'Sora',sans-serif;font-size:12px;cursor:pointer;letter-spacing:1px;text-transform:uppercase}
.bs:hover{border-color:var(--mid);color:var(--blanc)}
.dash{padding:32px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:32px}
.kpi{background:var(--gris);border:1px solid var(--gris3);border-radius:var(--r);padding:20px}
.kl{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:6px}
.kv{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--or)}
.ks{font-size:11px;color:var(--dim);margin-top:4px}
.kdiv{border-top:1px solid var(--gris3);margin:8px 0;padding-top:8px}
.kls{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:2px}
.kvs{font-family:'DM Mono',monospace;font-size:17px;font-weight:500}
.tw{background:var(--gris);border:1px solid var(--gris3);border-radius:var(--r);overflow:hidden}
.th2{padding:16px 20px;border-bottom:1px solid var(--gris3);font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--dim)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:10px 11px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);border-bottom:1px solid var(--gris3);font-weight:500;white-space:nowrap}
td{padding:11px;font-size:12px;border-bottom:1px solid #1a1a1a}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--gris2)}
.badge{display:inline-block;padding:3px 8px;border-radius:3px;font-size:9px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.bo{background:rgba(90,156,224,.15);color:var(--bleu)}
.ba{background:rgba(76,175,125,.15);color:var(--vert)}
.br{background:rgba(224,90,90,.15);color:var(--rouge)}
.bs2{background:rgba(201,168,76,.15);color:var(--or)}
.mono{font-family:'DM Mono',monospace}
.cor{color:var(--or)}.cv{color:var(--vert)}.cr{color:var(--rouge)}.cb{color:var(--bleu)}.cd{color:var(--dim);font-size:11px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:100;overflow-y:auto}
.mod{background:var(--gris);border:1px solid var(--gris3);border-radius:8px;width:100%;max-width:820px;margin:auto}
.mh{padding:20px 24px;border-bottom:1px solid var(--gris3);display:flex;align-items:center;justify-content:space-between}
.mt{font-family:'DM Serif Display',serif;font-size:20px;color:var(--or)}
.ms{font-size:11px;color:var(--dim);margin-top:3px}
.xb{background:none;border:1px solid var(--gris3);color:var(--dim);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
.xb:hover{border-color:var(--or);color:var(--or)}
.mb{padding:24px;display:flex;flex-direction:column;gap:20px}
.st{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--or);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--gris3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
.fld input,.fld select,.fld textarea{background:var(--noir);border:1px solid var(--gris3);color:var(--blanc);padding:9px 12px;border-radius:var(--r);font-family:'DM Mono',monospace;font-size:13px;outline:none;width:100%}

.ctot{border:1px solid var(--or)}

.ctot span:last-child{color:var(--or)}
.rt{width:100%;border-collapse:collapse}
.rt th{padding:9px 12px;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;font-weight:500;border-bottom:1px solid var(--gris3)}

  .ia-loading{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;padding:16px 0}
  .dp{display:flex;gap:4px}

  .dp span:nth-child(2){animation-delay:.2s}
  .dp span:nth-child(3){animation-delay:.4s}

  .btn-ia{background:var(--or);color:var(--noir);border:none;border-radius:var(--r);padding:12px 24px;font-family:"Sora",sans-serif;font-size:13px;font-weight:600;cursor:pointer;width:100%;transition:opacity .2s}
  .btn-ia:hover{opacity:.85}
  .btn-ia:disabled{background:var(--gris3);color:var(--dim);cursor:not-allowed}
  .score-box{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
  .score-item{background:var(--noir);border:1px solid var(--gris3);border-radius:var(--r);padding:14px;text-align:center}
  .score-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:6px}
  .score-value{font-family:"DM Mono",monospace;font-size:24px;font-weight:500}

function sbHeaders() {
  return {
    'Content-Type': 'application/json',
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY
  };
}

function loadFromSupabase(callback) {
  fetch(SB_URL + '/rest/v1/actifs?select=*&order=id.asc', {
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      'Accept': 'application/json'
    }
  })
  .then(function(r) {
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function(data) {
    console.log('SUPABASE OK:', data.length, 'lignes');
    if (Array.isArray(data) && data.length > 0) {
      actifs = data.map(function(row) {
        try {
          var a = typeof row.data === 'string' ? JSON.parse(row.data) : row.data;
          a.id = row.id;
          return a;
        } catch(e) {
          return JSON.parse(JSON.stringify(DEF));
        }
      });
      callback();
    } else {
      actifs = [JSON.parse(JSON.stringify(DEF)), JSON.parse(JSON.stringify(ACT002)), JSON.parse(JSON.stringify(ACT003))];
      callback();
    }
  })
  .catch(function(err) {
    console.log('SUPABASE ERROR:', err.message);
    actifs = [JSON.parse(JSON.stringify(DEF)), JSON.parse(JSON.stringify(ACT002)), JSON.parse(JSON.stringify(ACT003))];
    callback();
  });
}

function insertActif(a, callback) {
  fetch(SB_URL + '/rest/v1/actifs', {
    method: 'POST',
    headers: Object.assign({}, sbHeaders(), {'Prefer': 'return=representation'}),
    body: JSON.stringify({ ref: a.ref, data: JSON.stringify(a) })
  })
  .then(function(r) { return r.json(); })
  .then(function(rows) {
    if (rows && rows[0]) { a.id = rows[0].id; }
    if (callback) callback();
  })
  .catch(function() { if (callback) callback(); });
}

function updateActif(a, callback) {
  if (!a.id || typeof a.id !== 'number') { if(callback) callback(); return; }
  fetch(SB_URL + '/rest/v1/actifs?id=eq.' + a.id, {
    method: 'PATCH',
    headers: Object.assign({}, sbHeaders(), {'Prefer': 'return=minimal'}),
    body: JSON.stringify({ ref: a.ref, data: JSON.stringify(a) })
  })
  .then(function() { if (callback) callback(); })
  .catch(function() { if (callback) callback(); });
}

function calc(a,revOverride){
  var pr=parseFloat(a.prixOffre)||0;
  var rv=parseFloat(revOverride||a.prixRevente)||0;
  var su=parseFloat(a.surface)||1;
  var tr=parseFloat(a.travaux)||0;
  var fAA=pr*(parseFloat(a.tauxAgenceAchat)/100||0);
  var fN=pr*(parseFloat(a.tauxNotaire)/100||0.03);
  var fB=pr*(parseFloat(a.tauxBancaire)/100||0.07)*0.75*(10/12);
  var fH=pr*(parseFloat(a.tauxHypotheque)/100||0.015);
  var fLH=parseFloat(a.fraisLeveeHypotheque)||1500;
  var fSEP=(pr+tr)*(parseFloat(a.tauxSEP)/100||0.02);
  var fC=(parseFloat(a.taxeFonciere)||0)+(parseFloat(a.charges)||0);
  var fS=(a.geometre?parseFloat(a.coutGeometre)||996:0)+(a.ingenieurBeton?parseFloat(a.coutIngenieur)||0:0)+(a.age?parseFloat(a.coutAGE)||0:0)+(a.rachatPartieCommune?parseFloat(a.coutRachat)||1000:0)+(a.modificationRCP?parseFloat(a.coutRCP)||0:0)+(a.permisConstructire?parseFloat(a.coutPermis)||0:0);
  var fAR=rv*(parseFloat(a.tauxAgenceRevente)/100||0.05);
  var tot=pr+fAA+fN+tr+fB+fH+fLH+fSEP+fC+fS;
  var pv=rv-fAR-tot;
  var mg=tot>0?(pv/tot)*100:0;
  return {fAA:fAA,fN:fN,fB:fB,fH:fH,fLH:fLH,fSEP:fSEP,fC:fC,fS:fS,fAR:fAR,tot:tot,pv:pv,mg:mg,m2:pr/su};
}

function renderKPI(){
  var n=actifs.length;

function buildCalc(){

  var cT=a.prixReventeCible?calc(a,a.prixReventeCible):null;
  var tR=parseFloat(a.tauxAgenceRevente)/100||0.05;
  var tC=parseFloat(a.agenceTauxCommission)||0;

  var lignes=[
    ["Prix d'achat",parseFloat(a.prixOffre)||0],
    ["Frais agence achat",c.fAA],["Frais de notaire",c.fN],
    ["Travaux & équipements",parseFloat(a.travaux)||0],

  lignes.forEach(function(l){h+='<div class="cr2"><span style="color:var(--mid)">'+l[0]+'</span><span class="mono">'+fmt(l[1])+'</span></div>';});
  h+='<div class="cr2 ctot"><span>TOTAL COÛT</span><span class="mono">'+fmt(c.tot)+'</span></div>';

    h+='<div class="st" style="margin-top:16px">Résultats — Comparaison scénarios</div>';
    h+='<div class="rtw"><table class="rt"><thead><tr>';
    h+='<th style="text-align:left;color:var(--dim)"></th>';

    h+='<th style="text-align:right;color:var(--or)">Cible</th>';

      ["Prix de revente",cC?fmt(parseFloat(a.prixReventeConservateur)):'—',cT?fmt(parseFloat(a.prixReventeCible)):'—',false],
      ["Frais agence revente",cC?fmt(parseFloat(a.prixReventeConservateur)*tR):'—',cT?fmt(parseFloat(a.prixReventeCible)*tR):'—',false],
      ["Prix net vendeur",cC?fmt(parseFloat(a.prixReventeConservateur)*(1-tR)):'—',cT?fmt(parseFloat(a.prixReventeCible)*(1-tR)):'—',false],
      ["Plus-value",cC?fmt(cC.pv):'—',cT?fmt(cT.pv):'—',true],
      ["Marge %",cC?fmtP(cC.mg):'—',cT?fmtP(cT.mg):'—',true]
    ];
    rows.forEach(function(r){
      var vc=r[3]&&cC?(cC.pv>=0?'var(--vert)':'var(--rouge)'):'var(--blanc)';
      var vt=r[3]&&cT?(cT.pv>=0?'var(--vert)':'var(--rouge)'):'var(--blanc)';

      h+='<td style="text-align:right;color:'+vt+'">'+r[2]+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }

  if(tC&&(a.prixReventeConservateur||a.prixReventeCible)){
    h+='<div class="st" style="margin-top:8px">Commission agent</div>';
    h+='<div class="dv" style="font-size:11px">';

  if(id===1) return actifSelect+'<div class="fld"><label>Infos complémentaires (optionnel)</label><input type="text" id="ag1-info" placeholder="ex: proche métro, refait à neuf..." style="font-family:Sora,sans-serif"/></div><button class="btn-ia" onclick="lancerAnalyste()">Analyser le marché</button><div id="ag1-result"></div>';
  if(id===2) return actifSelect+'<button class="btn-ia" onclick="lancerVerificateur()">Vérifier la rentabilité</button><div id="ag2-result"></div>';
  if(id===3) return actifSelect+'<div class="fld"><label>Nom du destinataire (optionnel)</label><input type="text" id="ag3-dest" placeholder="ex: M. Dupont" style="font-family:Sora,sans-serif"/></div><button class="btn-ia" onclick="lancerSynthese()">Générer la synthèse</button><div id="ag3-result"></div>';
  if(id===4) return actifSelect+'<button class="btn-ia" onclick="lancerScore()">Scorer</button><div id="ag4-result"></div>';
  if(id===5) return '<div style="display:flex;flex-direction:column;gap:16px">'
    +'<div class="g2">'
    +'<div class="fld"><label>Arrondissements cibles</label><input type="text" id="ch-arrondissements" value="Paris 16e, Paris 15e, Paris 11e" style="font-family:Sora,sans-serif"/></div>'
    +'<div class="fld"><label>Budget max acquisition (€)</label><input type="number" id="ch-budget" value="1500000"/></div>'
    +'<div class="fld"><label>Surface min (m²)</label><input type="number" id="ch-surf-min" value="50"/></div>'
    +'<div class="fld"><label>Surface max (m²)</label><input type="number" id="ch-surf-max" value="200"/></div>'
    +'</div>'
    +'<button class="btn-ia" id="ch-btn" onclick="lancerChasseur()">🔍 Lancer la chasse</button>'
    +'<div id="ch-result"></div>'
    +'</div>';
  return '<div style="background:var(--noir);border:1px solid var(--gris3);border-radius:var(--r);padding:20px;color:var(--dim)">Bientôt disponible.</div>';
}

function getActifSelected() {
  var sel = document.getElementById('ag-actif');
  if(!sel) return actifs[0];
  var id = parseInt(sel.value);
  return actifs.find(function(a){return a.id===id;})||actifs[0];
}

// ── callClaude — moteur principal des agents 1-2-3 ──────────────────────
function callClaude(prompt, resultId, btnText) {
  var btn = document.querySelector('.btn-ia');
  if(btn){btn.disabled=true;btn.textContent='En cours…';}
  var el = document.getElementById(resultId);
  if(el) el.innerHTML = '<div style="display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;padding:16px 0"><div style="display:flex;gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:var(--or);animation:pulse 1.4s infinite both;display:inline-block"></span><span style="width:6px;height:6px;border-radius:50%;background:var(--or);animation:pulse 1.4s .2s infinite both;display:inline-block"></span><span style="width:6px;height:6px;border-radius:50%;background:var(--or);animation:pulse 1.4s .4s infinite both;display:inline-block"></span></div> Agent en cours de réflexion…</div>';
  fetch('https://movaapi.vercel.app/api/claude',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:2000,messages:[{role:'user',content:prompt}]})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var txt = d.content&&d.content[0]?d.content[0].text:'Erreur de génération.';
    if(el) el.innerHTML='<div style="background:var(--noir);border:1px solid var(--gris3);border-radius:var(--r);padding:20px;font-size:13px;line-height:1.8;color:var(--blanc);white-space:pre-wrap">'+esc(txt)+'</div>'
      +'<button onclick="navigator.clipboard.writeText(this.previousSibling.textContent)" style="margin-top:10px;background:none;border:1px solid var(--bleu);color:var(--bleu);border-radius:var(--r);padding:8px 16px;font-family:Sora,sans-serif;font-size:12px;cursor:pointer">📋 Copier</button>';
    if(btn){btn.disabled=false;btn.textContent=btnText;}
  })
  .catch(function(){
    if(el) el.innerHTML='<div style="background:var(--noir);border:1px solid var(--rouge);border-radius:var(--r);padding:14px;color:var(--rouge);font-size:12px">Erreur de connexion.</div>';
    if(btn){btn.disabled=false;btn.textContent=btnText;}
  });
}

// ── Agent 1 — Analyste de marché ─────────────────────────────────────────
function lancerAnalyste() {
  var a = getActifSelected();
  var info = (document.getElementById('ag1-info')||{}).value||'';
  var c = calc(a);
  var prompt = 'Tu es un expert marchand de biens français spécialisé Paris Île-de-France.\n\nACTIF À ANALYSER :\n- Adresse : '+(a.adresse||'?')+', '+(a.ville||'')+'\n- Type : '+(a.typeImmeuble||a.nature||'?')+'\n- Surface totale : '+(a.surface||'?')+' m²\n- Configuration : '+(a.notes||'non renseignée')+'\n- Prix acquisition : '+fmt(parseFloat(a.prixOffre))+' ('+fmt(c.m2)+'/m²)\n- Travaux prévus : '+fmt(parseFloat(a.travaux))+' ('+fmt(parseFloat(a.travaux)/(parseFloat(a.surface)||1))+'/m²)\n'+(a.prixReventeConservateur?'- Revente conservatrice visée : '+fmt(parseFloat(a.prixReventeConservateur))+' ('+fmt(parseFloat(a.prixReventeConservateur)/(parseFloat(a.surface)||1))+'/m²)\n':'')+(a.prixReventeCible?'- Revente cible visée : '+fmt(parseFloat(a.prixReventeCible))+' ('+fmt(parseFloat(a.prixReventeCible)/(parseFloat(a.surface)||1))+'/m²)\n':'')+(info?'- Infos complémentaires : '+info+'\n':'')+'\nMODÈLE FINANCIER APPLIQUÉ :\n- Frais notaire : 3% (structure SPPE marchand de biens)\n- Financement : 7% sur 75% du coût total, durée 7 mois\n- Frais de vente : 2% du prix de revente\n- Objectif marge brute : 30% minimum\n\nDonne une analyse détaillée :\n1) Fourchette prix/m² secteur actuelle (données 2025)\n2) Évaluation du prix acquisition (décote, justification)\n3) Réalisme des prix de revente visés\n4) Tendance marché 2025-2026\n5) Recommandation finale VIABLE / RISQUÉE / DÉCONSEILLÉE\n\nSois précis, chiffré, direct. Maximum 500 mots.';
  callClaude(prompt,'ag1-result','Nouvelle analyse');
}

// ── Agent 2 — Vérificateur de rentabilité ────────────────────────────────
function lancerVerificateur() {
  var a = getActifSelected();
  var c = calc(a);
  var cC = a.prixReventeConservateur?calc(a,a.prixReventeConservateur):null;
  var cT = a.prixReventeCible?calc(a,a.prixReventeCible):null;
  var prompt = 'Tu es un expert marchand de biens français.\n\nVÉRIFICATION FINANCIÈRE :\n- Bien : '+(a.adresse||'?')+', '+(a.ville||'')+'\n- Surface : '+(a.surface||'?')+' m², type : '+(a.typeImmeuble||a.nature||'?')+'\n- Configuration : '+(a.notes||'non renseignée')+'\n- Prix achat : '+fmt(parseFloat(a.prixOffre))+' ('+fmt(c.m2)+'/m²)\n- Travaux : '+fmt(parseFloat(a.travaux))+'\n- Coût total : '+fmt(c.tot)+'\n- Frais notaire : '+fmt(c.fN)+' (3% SPPE)\n- Frais bancaires : '+fmt(c.fB)+' (7% sur 75% / 7 mois)\n- Frais SEP : '+fmt(c.fSEP)+'\n- Frais spéciaux : '+fmt(c.fS)+'\n'+(cC?'- Scénario conservateur : '+fmt(parseFloat(a.prixReventeConservateur))+' → PV net '+fmt(cC.pv)+' (marge '+fmtP(cC.mg)+')\n':'')+(cT?'- Scénario cible : '+fmt(parseFloat(a.prixReventeCible))+' → PV net '+fmt(cT.pv)+' (marge '+fmtP(cT.mg)+')\n':'')+'\nAnalyse :\n1) Frais correctement estimés ?\n2) Postes oubliés ou sous-estimés ?\n3) Marge suffisante (seuil 30%) ?\n4) Risques principaux ?\n5) Verdict : VIABLE / RISQUÉE / DÉCONSEILLÉE\n\nSois direct et chiffré.';
  callClaude(prompt,'ag2-result','Nouvelle vérification');
}

// ── Agent 3 — Rédacteur de synthèse ──────────────────────────────────────
function lancerSynthese() {
  var a = getActifSelected();
  var dest = (document.getElementById('ag3-dest')||{}).value||'';
  var c = calc(a);
  var cC = a.prixReventeConservateur?calc(a,a.prixReventeConservateur):null;
  var cT = a.prixReventeCible?calc(a,a.prixReventeCible):null;
  var prompt = 'Tu es consultant immobilier senior. Rédige une note investisseur professionnelle.\n\nBIEN :\n- Adresse : '+(a.adresse||'?')+', '+(a.ville||'')+'\n- Type : '+(a.typeImmeuble||a.nature||'?')+' — '+(a.surface||'?')+' m²\n- Configuration : '+(a.notes||'non renseignée')+'\n- Prix acquisition : '+fmt(parseFloat(a.prixOffre))+'\n- Travaux : '+fmt(parseFloat(a.travaux))+'\n- Coût total : '+fmt(c.tot)+'\n'+(cC?'- Conservateur : '+fmt(parseFloat(a.prixReventeConservateur))+' → Marge '+fmtP(cC.mg)+' (PV '+fmt(cC.pv)+')\n':'')+(cT?'- Cible : '+fmt(parseFloat(a.prixReventeCible))+' → Marge '+fmtP(cT.mg)+' (PV '+fmt(cT.pv)+')\n':'')+(dest?'- Destinataire : '+dest+'\n':'')+'\nMODÈLE : Notaire 3% SPPE, financement 7%/75%/7 mois, frais vente 2%, objectif 30% marge.\n\nFormat : Introduction — Descriptif — Analyse financière — Points forts/risques — Conclusion. Ton professionnel, 400 mots max.';
  callClaude(prompt,'ag3-result','Nouvelle synthèse');
}

// ── Agent 4 — Scoreur ─────────────────────────────────────────────────────
function lancerScore() {
  var a = getActifSelected();
  var c = calc(a);
  var cC = a.prixReventeConservateur?calc(a,a.prixReventeConservateur):null;
  var cT = a.prixReventeCible?calc(a,a.prixReventeCible):null;
  var prompt = 'Note cette opportunité immobilière de 1 à 10.\n\nBIEN :\n- Adresse : '+(a.adresse||'?')+', '+(a.ville||'')+'\n- Type : '+(a.typeImmeuble||a.nature||'?')+' — '+(a.surface||'?')+' m²\n- Prix acquisition : '+fmt(parseFloat(a.prixOffre))+' ('+fmt(c.m2)+'/m²)\n- Travaux : '+fmt(parseFloat(a.travaux))+'\n- Coût total : '+fmt(c.tot)+'\n'+(cC?'- Marge conservatrice : '+fmtP(cC.mg)+'\n':'')+(cT?'- Marge cible : '+fmtP(cT.mg)+'\n':'')+'\nMODÈLE : Notaire 3% SPPE, financement 7%/75%/7 mois, frais vente 2%, seuil viabilité 30%.\n\nRéponds UNIQUEMENT en JSON sans backticks :\n{"rentabilite":X,"risque":X,"potentiel":X,"localisation":X,"score_global":X,"verdict":"texte court","recommandation":"texte court"}';
  var el = document.getElementById('ag4-result');
  var btn = document.querySelector('.btn-ia');
  if(btn){btn.disabled=true;btn.textContent='Calcul en cours…';}
  if(el) el.innerHTML='<div style="display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;padding:16px 0">Calcul du score…</div>';
  fetch('https://movaapi.vercel.app/api/claude',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:500,messages:[{role:'user',content:prompt}]})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var txt = d.content&&d.content[0]?d.content[0].text:'{}';
    try {
      var dd = JSON.parse(txt.replace(/```json|```/g,'').trim());
      var sc = dd.score_global||0;
      var col = sc>=7?'var(--vert)':sc>=5?'var(--or)':'var(--rouge)';
      var items = [['Rentabilité',dd.rentabilite],['Risque',dd.risque],['Potentiel',dd.potentiel],['Localisation',dd.localisation]];
      var grid = '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px">'
        +items.map(function(x){var c2=x[1]>=7?'var(--vert)':x[1]>=5?'var(--or)':'var(--rouge)';return '<div style="background:var(--noir);border:1px solid var(--gris3);border-radius:var(--r);padding:12px;text-align:center"><div style="font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:4px">'+x[0]+'</div><div style="font-family:DM Mono,monospace;font-size:22px;color:'+c2+'">'+x[1]+'/10</div></div>';}).join('')
        +'<div style="background:var(--noir);border:2px solid '+col+';border-radius:var(--r);padding:12px;text-align:center;grid-column:span 2"><div style="font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:4px">Score global</div><div style="font-family:DM Mono,monospace;font-size:28px;color:'+col+'">'+sc+'/10</div></div>'
        +'</div>';
      if(el) el.innerHTML=grid+'<div style="background:var(--noir);border:1px solid var(--gris3);border-radius:var(--r);padding:16px;font-size:13px;line-height:1.7;color:var(--blanc)"><strong style="color:var(--or)">Verdict :</strong> '+esc(dd.verdict||'')+'\n\n<strong style="color:var(--or)">Recommandation :</strong> '+esc(dd.recommandation||'')+'</div>';
    } catch(e) {
      if(el) el.innerHTML='<div style="background:var(--noir);border:1px solid var(--gris3);border-radius:var(--r);padding:16px;font-size:13px;color:var(--blanc);white-space:pre-wrap">'+esc(txt)+'</div>';
    }
    if(btn){btn.disabled=false;btn.textContent='Nouveau score';}
  })
  .catch(function(){
    if(el) el.innerHTML='<div style="color:var(--rouge);font-size:12px;padding:10px">Erreur de connexion.</div>';
    if(btn){btn.disabled=false;btn.textContent='Nouveau score';}
  });
}

// ── Agent 5 — Chasseur d'opportunités ────────────────────────────────────
function lancerChasseur() {
  var arr = (document.getElementById('ch-arrondissements')||{}).value||'Paris 16e, Paris 15e, Paris 11e';
  var surfMin = (document.getElementById('ch-surf-min')||{}).value||'50';
  var surfMax = (document.getElementById('ch-surf-max')||{}).value||'200';
  var budgetMax = (document.getElementById('ch-budget')||{}).value||'1500000';
  var el = document.getElementById('ch-result');
  var btn = document.getElementById('ch-btn');
  if(btn){btn.disabled=true;btn.textContent='Recherche en cours…';}
  if(el) el.innerHTML='<div style="display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;padding:16px 0"><div style="display:flex;gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:var(--or);animation:pulse 1.4s infinite both;display:inline-block"></span><span style="width:6px;height:6px;border-radius:50%;background:var(--or);animation:pulse 1.4s .2s infinite both;display:inline-block"></span><span style="width:6px;height:6px;border-radius:50%;background:var(--or);animation:pulse 1.4s .4s infinite both;display:inline-block"></span></div> Chasseur en cours de recherche…</div>';
  fetch('https://movaapi.vercel.app/api/claude',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-opus-4-5',
      max_tokens:3000,
      tools:[{"type":"web_search_20250305","name":"web_search"}],
      messages:[{role:'user',content:'Tu es un chasseur immobilier expert marchand de biens Paris Île-de-France.\n\nCRITÈRES DE RECHERCHE :\n- Arrondissements : '+arr+'\n- Surface : '+surfMin+'m² à '+surfMax+'m²\n- Budget max acquisition : '+budgetMax+'€\n- Type : appartements Haussmanniens, immeubles, lots à diviser\n\nMODÈLE DE RENTABILITÉ MARCHAND DE BIENS :\n- Frais notaire : 3% (structure SPPE)\n- Financement : 7% sur 75% du coût total / 7 mois\n- Travaux estimés : 1 500 à 1 700€/m²\n- Frais vente : 2%\n- Marge minimum requise : 30%\n\nEFFECTUE DES RECHERCHES sur SeLoger, LeBonCoin, PAP, Bienici pour trouver des annonces actuelles correspondant à ces critères.\n\nPour chaque opportunité trouvée, présente :\n1. Adresse et prix demandé\n2. Surface et prix/m²\n3. Calcul rapide de viabilité (coût total estimé vs revente marché)\n4. Marge estimée\n5. Verdict : ✅ VIABLE / ⚠️ RISQUÉE / ❌ PASSER\n\nNe remonte QUE les opportunités avec potentiel de marge ≥ 30%. Si aucune ne passe le filtre, dis-le clairement.'}]
    })
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var txt = '';
    if(d.content) d.content.forEach(function(b){if(b.type==='text')txt+=b.text;});
    if(!txt) txt='Aucune opportunité trouvée correspondant à vos critères.';
    if(el) el.innerHTML='<div style="background:var(--noir);border:1px solid var(--gris3);border-radius:var(--r);padding:20px;font-size:13px;line-height:1.8;color:var(--blanc);white-space:pre-wrap">'+esc(txt)+'</div>'
      +'<button onclick="navigator.clipboard.writeText(this.previousSibling.textContent)" style="margin-top:10px;background:none;border:1px solid var(--bleu);color:var(--bleu);border-radius:var(--r);padding:8px 16px;font-family:Sora,sans-serif;font-size:12px;cursor:pointer">📋 Copier</button>';
    if(btn){btn.disabled=false;btn.textContent='Nouvelle recherche';}
  })
  .catch(function(){
    if(el) el.innerHTML='<div style="background:var(--noir);border:1px solid var(--rouge);border-radius:var(--r);padding:14px;color:var(--rouge);font-size:12px">Erreur de connexion.</div>';
    if(btn){btn.disabled=false;btn.textContent='Nouvelle recherche';}
  });
}

// ── Événements ────────────────────────────────────────────────────────────
function bindEvents() {
  var elems = {
    'btn-nouveau': openNew,
    'btn-agents': openAgentsPanel,
    'btn-fermer': closeModal,
    'btn-annuler': closeModal,
    'btn-reset': resetActif,
    'btn-save': saveActif
  };
  Object.keys(elems).forEach(function(id) {
    var el = document.getElementById(id);
    if(el) el.addEventListener('click', elems[id]);
  });
  var modal = document.getElementById('modal');
  if(modal) modal.addEventListener('click', function(e){if(e.target===this)closeModal();});
}
